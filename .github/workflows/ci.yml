name: CI

# Runs on every push and pull request. The pipeline is ordered so the cheapest,
# most informative checks fail first: unit tests before integration tests,
# integration tests before image builds.

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

concurrency:
  # A newer push supersedes an in-flight run on the same branch.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  REGISTRY: ghcr.io

jobs:
  backend-test:
    name: Backend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build and test
        run: mvn -B -f backend/pom.xml verify

      - name: Publish test report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: backend/**/target/surefire-reports/TEST-*.xml
          # A failed test must fail the job even when the report step succeeds.
          fail_on_failure: true

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/**/target/site/jacoco/

  backend-integration-test:
    name: Backend integration tests
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      # Testcontainers starts a real MySQL, so Flyway migrations and the actual
      # SQL are exercised. An in-memory database would pass on schemas MySQL
      # rejects, which is precisely the failure this stage exists to catch.
      - name: Run integration tests
        run: mvn -B -f backend/pom.xml verify -Pintegration-test
        env:
          TESTCONTAINERS_RYUK_DISABLED: "false"

  security-scan:
    name: Security scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      # Fails the build on a known-vulnerable dependency. Financial software
      # inherits its supply chain's weaknesses.
      - name: Dependency vulnerability scan
        run: mvn -B -f backend/pom.xml org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=7
        continue-on-error: false

      - name: Static analysis
        uses: github/codeql-action/init@v3
        with:
          languages: java

      - name: Build for CodeQL
        run: mvn -B -f backend/pom.xml compile -DskipTests

      - name: CodeQL analysis
        uses: github/codeql-action/analyze@v3

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mobile-test:
    name: Flutter analyse and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.x"
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Verify formatting
        working-directory: mobile
        run: dart format --output=none --set-exit-if-changed .

      - name: Static analysis
        working-directory: mobile
        run: flutter analyze --fatal-infos

      - name: Unit and widget tests
        working-directory: mobile
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-coverage
          path: mobile/coverage/lcov.info

  build-images:
    name: Build and push images
    runs-on: ubuntu-latest
    needs: [backend-test, backend-integration-test, security-scan]
    # Images are only published from the default branch: a pull request proves
    # the code builds, it does not earn a place in the registry.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - identity-service
          - tenant-service
          - customer-service
          - loan-product-service
          - loan-origination-service
          - loan-account-service
          - payment-service
          - ledger-service
          - notification-service
          - reporting-audit-service
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          build-args: SERVICE=${{ matrix.service }}
          push: true
          # Tagged with the commit SHA, never only "latest": a deployment must
          # be able to name exactly which build is running.
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: true
          sbom: true

      - name: Scan the image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}
