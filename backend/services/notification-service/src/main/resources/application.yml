server:
  port: 8089
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: notification-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/mfin_notification?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&rewriteBatchedStatements=true}
    username: ${DB_USERNAME:mfin}
    password: ${DB_PASSWORD:mfin}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: 5
      connection-timeout: 10000
      leak-detection-threshold: 30000
  jpa:
    hibernate:
      ddl-auto: validate        # Flyway owns the schema; Hibernate only verifies it
    open-in-view: false          # keeps transactions explicit and short
    properties:
      hibernate:
        jdbc.time_zone: UTC
        order_inserts: true
        order_updates: true
        jdbc.batch_size: 50
        query.fail_on_pagination_over_collection_fetch: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    producer:
      acks: all                  # never acknowledge a domain event the broker has not replicated
      retries: 5
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual_immediate
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWKS_URI:http://localhost:8081/oauth2/jwks}
          issuer-uri: ${TOKEN_ISSUER:http://localhost:8081}

mfin:
  crypto:
    data-key: ${CRYPTO_DATA_KEY:}
    index-key: ${CRYPTO_INDEX_KEY:}
    key-version: ${CRYPTO_KEY_VERSION:v1}
  outbox:
    enabled: true
    batch-size: 100
    poll-interval-ms: 2000
  openapi:
    gateway-url: ${GATEWAY_URL:http://localhost:8080}
  security:
    cors:
      allowed-origins: ${CORS_ORIGINS:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true            # separate liveness/readiness groups for Kubernetes
      show-details: when_authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: notification-service
  tracing:
    sampling:
      probability: ${TRACE_SAMPLE_RATE:0.1}
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 20
        failureRateThreshold: 50
        waitDurationInOpenState: 20s
        permittedNumberOfCallsInHalfOpenState: 5
        registerHealthIndicator: true
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 200ms
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
  timelimiter:
    configs:
      default:
        timeoutDuration: 3s

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.mfin: ${LOG_LEVEL:INFO}
    org.hibernate.SQL: WARN
