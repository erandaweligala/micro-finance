# Local development stack.
#
# Brings up MySQL, Kafka, Redis and the eleven services. Each service owns its
# own database - they are separate schemas on one MySQL instance here purely to
# keep a laptop workable; in every deployed environment they are separate
# instances, because "shares a server" degrades into "shares a schema" the first
# time someone is in a hurry.
#
#   docker compose -f deploy/docker/docker-compose.yml up -d --build

name: microfinance

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks: [mfin]
  # Without a limit each JVM applies -XX:MaxRAMPercentage=75 to the whole Docker
  # VM, so eleven of them each size a heap for three quarters of the machine and
  # the kernel eventually kills whatever it reaches first - usually MySQL, which
  # takes the entire stack down with it. 640m leaves roughly a 480m heap.
  mem_limit: 640m
  depends_on:
    mysql:
      condition: service_healthy
    kafka:
      condition: service_started
  environment: &service-env
    DB_USERNAME: mfin
    DB_PASSWORD: mfin
    KAFKA_BROKERS: kafka:9092
    JWKS_URI: http://identity-service:8081/oauth2/jwks
    TOKEN_ISSUER: http://identity-service:8081
    GATEWAY_URL: http://localhost:8080
    # Development keys only. Every deployed environment injects these from a
    # secret store; the services refuse to start without them.
    # The data key must decode to exactly 16, 24 or 32 bytes - AES rejects any
    # other length, and it does so on the first encrypted write rather than at
    # startup, so a wrong length looks like a working stack until it isn't.
    CRYPTO_DATA_KEY: ZGV2LWRhdGEta2V5LTMyLWJ5dGVzLWFlcy1sb2NhbCE=
    CRYPTO_INDEX_KEY: ZGV2LWluZGV4LWtleS0zMi1ieXRlcy1sb25nLWZvci1obWFj
    LOG_LEVEL: INFO
    TRACE_SAMPLE_RATE: "1.0"
  healthcheck:
    # Each service listens on its own SERVER_PORT, so the probe has to read it
    # rather than assume 8080 - the "$$" defers expansion to the container.
    test: ["CMD-SHELL",
           "wget -q -O- http://localhost:$${SERVER_PORT:-8080}/actuator/health/readiness || exit 1"]
    interval: 20s
    timeout: 5s
    retries: 10
    start_period: 90s

services:
  mysql:
    image: mysql:8.4
    container_name: mfin-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # Financial writes must survive a host failure, so durability is not traded
      # for throughput even locally - it keeps local behaviour honest.
      - --innodb-flush-log-at-trx-commit=1
      - --sync-binlog=1
      - --max-connections=500
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: mfin
      MYSQL_PASSWORD: mfin
      MYSQL_DATABASE: mfin_identity
    restart: unless-stopped
    mem_limit: 1g
    ports: ["${MYSQL_PORT:-3306}:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-databases.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-umfin", "-pmfin"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks: [mfin]

  # The Apache-published image rather than a vendor rebuild: Bitnami emptied its
  # public Docker Hub catalogue in 2025 and bitnami/kafka:3.7 stopped resolving,
  # which broke every fresh checkout of this stack. Note the env var names differ
  # from Bitnami's - here KAFKA_<A>_<B> maps to the server property a.b.
  kafka:
    image: apache/kafka:3.7.2
    container_name: mfin-kafka
    environment:
      # KRaft mode: no ZooKeeper to run or reason about.
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # One broker, so the internal topics cannot be replicated three ways -
      # left at the default they fail to create and every producer stalls.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    restart: unless-stopped
    mem_limit: 1g
    ports: ["${KAFKA_PORT:-9092}:9092"]
    # Deliberately no volume. The broker runs unprivileged, so a named volume
    # mounts root-owned and the log dir is unwritable. Local broker state is
    # disposable anyway - MySQL is the source of truth and the outbox replays.
    networks: [mfin]

  redis:
    image: redis:7-alpine
    container_name: mfin-redis
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    mem_limit: 256m
    ports: ["${REDIS_PORT:-6379}:6379"]
    volumes: [redis-data:/data]
    networks: [mfin]

  # --- Edge ------------------------------------------------------------------
  api-gateway:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      args: {SERVICE: api-gateway}
    container_name: mfin-api-gateway
    restart: unless-stopped
    mem_limit: 640m
    networks: [mfin]
    ports: ["${GATEWAY_PORT:-8080}:8080"]
    environment:
      REDIS_HOST: redis
      JWKS_URI: http://identity-service:8081/oauth2/jwks
      TOKEN_ISSUER: http://identity-service:8081
      IDENTITY_URI: http://identity-service:8081
      TENANT_URI: http://tenant-service:8082
      CUSTOMER_URI: http://customer-service:8083
      PRODUCT_URI: http://loan-product-service:8084
      ORIGINATION_URI: http://loan-origination-service:8085
      LOAN_ACCOUNT_URI: http://loan-account-service:8086
      PAYMENT_URI: http://payment-service:8087
      LEDGER_URI: http://ledger-service:8088
      NOTIFICATION_URI: http://notification-service:8089
      REPORTING_URI: http://reporting-audit-service:8090
    depends_on: [identity-service, redis]

  # --- Business services -----------------------------------------------------
  identity-service:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      args: {SERVICE: identity-service}
    container_name: mfin-identity
    ports: ["8081:8081"]
    environment:
      <<: *service-env
      SERVER_PORT: "8081"
      DB_URL: jdbc:mysql://mysql:3306/mfin_identity?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

  tenant-service:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      args: {SERVICE: tenant-service}
    container_name: mfin-tenant
    ports: ["8082:8082"]
    environment:
      <<: *service-env
      SERVER_PORT: "8082"
      DB_URL: jdbc:mysql://mysql:3306/mfin_tenant?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

  customer-service:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      args: {SERVICE: customer-service}
    container_name: mfin-customer
    ports: ["8083:8083"]
    environment:
      <<: *service-env
      SERVER_PORT: "8083"
      DB_URL: jdbc:mysql://mysql:3306/mfin_customer?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

  loan-product-service:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      args: {SERVICE: loan-product-service}
    container_name: mfin-loan-product
    ports: ["8084:8084"]
    environment:
      <<: *service-env
      SERVER_PORT: "8084"
      DB_URL: jdbc:mysql://mysql:3306/mfin_product?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

  loan-origination-service:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      args: {SERVICE: loan-origination-service}
    container_name: mfin-origination
    ports: ["8085:8085"]
    environment:
      <<: *service-env
      SERVER_PORT: "8085"
      DB_URL: jdbc:mysql://mysql:3306/mfin_origination?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

  loan-account-service:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      args: {SERVICE: loan-account-service}
    container_name: mfin-loan-account
    ports: ["8086:8086"]
    environment:
      <<: *service-env
      SERVER_PORT: "8086"
      DB_URL: jdbc:mysql://mysql:3306/mfin_loanaccount?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

  payment-service:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      args: {SERVICE: payment-service}
    container_name: mfin-payment
    ports: ["8087:8087"]
    environment:
      <<: *service-env
      SERVER_PORT: "8087"
      DB_URL: jdbc:mysql://mysql:3306/mfin_payment?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

  ledger-service:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      args: {SERVICE: ledger-service}
    container_name: mfin-ledger
    ports: ["8088:8088"]
    environment:
      <<: *service-env
      SERVER_PORT: "8088"
      DB_URL: jdbc:mysql://mysql:3306/mfin_ledger?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

  notification-service:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      args: {SERVICE: notification-service}
    container_name: mfin-notification
    ports: ["8089:8089"]
    environment:
      <<: *service-env
      SERVER_PORT: "8089"
      DB_URL: jdbc:mysql://mysql:3306/mfin_notification?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

  reporting-audit-service:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      args: {SERVICE: reporting-audit-service}
    container_name: mfin-reporting
    ports: ["8090:8090"]
    environment:
      <<: *service-env
      SERVER_PORT: "8090"
      DB_URL: jdbc:mysql://mysql:3306/mfin_reporting?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

volumes:
  mysql-data:
  redis-data:

networks:
  mfin:
    driver: bridge
